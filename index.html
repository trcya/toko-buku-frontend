<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toko Buku PKL - Full CRUD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-600 via-blue-800 to-indigo-950 min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto py-10">
        <div class="text-center mb-12">
            <h1 class="text-5xl font-extrabold text-white mb-2 drop-shadow-xl">Sistem Informasi Buku</h1>
            <p class="text-blue-200 opacity-90 font-light tracking-wide">Node.js + PostgreSQL + Tailwind CSS</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1">
                <div class="bg-white/95 backdrop-blur-md p-8 rounded-3xl shadow-2xl border border-white/20 sticky top-10">
                    <h2 class="text-2xl font-bold text-gray-800 mb-6 flex items-center">
                        <span class="mr-3">📚</span> Tambah Buku
                    </h2>
                    <div class="space-y-5">
                        <div>
                            <label class="block text-sm font-semibold text-gray-600 mb-1 ml-1">Judul Buku</label>
                            <input type="text" id="judul" placeholder="Contoh: Belajar Coding" 
                                class="w-full p-4 bg-gray-50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none transition-all shadow-inner">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-600 mb-1 ml-1">Penulis</label>
                            <input type="text" id="penulis" placeholder="Nama penulis" 
                                class="w-full p-4 bg-gray-50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none transition-all shadow-inner">
                        </div>
                        <button onclick="tambahBuku()" 
                            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl shadow-xl shadow-blue-500/30 transition-all active:scale-95 transform hover:-translate-y-1">
                            Simpan Ke Database
                        </button>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-2">
                <div class="bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl border border-white/20 overflow-hidden">
                    <table class="w-full text-left">
                        <thead class="bg-gray-100/80 border-b border-gray-200">
                            <tr>
                                <th class="p-5 text-xs font-bold text-gray-500 uppercase tracking-widest">ID Urut</th>
                                <th class="p-5 text-xs font-bold text-gray-500 uppercase tracking-widest">Judul</th>
                                <th class="p-5 text-xs font-bold text-gray-500 uppercase tracking-widest">Penulis</th>
                                <th class="p-5 text-xs font-bold text-gray-500 uppercase tracking-widest text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tabel-buku" class="divide-y divide-gray-100">
                            </tbody>
                    </table>
                </div>
                <p class="text-blue-200/50 text-xs mt-4 text-center">Data otomatis diurutkan berdasarkan Abjad (Judul)</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
